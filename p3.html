<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Jingyi Wang – Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Raleway:wght@300;400;700&display=swap"
    rel="stylesheet">

  <!-- Base CSS -->
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/custom.css">

  <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.9.0/jquery.min.js"></script>

  <style>
    /* ---------- Global ---------- */
    body {
      font-family: 'Raleway', sans-serif;
      background-color: #faf3e0;
      color: #333;
      margin: 0;
    }

    h3 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      text-align: center;
      margin-bottom: 15px;
    }

    /* ---------- Navbar ---------- */
    .navbar {
      background-color: #faf3e0;
      padding: 10px 0;
    }

    .navbar ul {
      display: flex;
      justify-content: center;
      gap: 24px;
      list-style: none;
      padding: 15px 0;
      margin: 0;
    }

    .navbar-link {
      font-weight: 700;
      text-transform: uppercase;
      color: #333;
      text-decoration: none;
      letter-spacing: 0.05em;
    }

    .navbar-link:hover {
      color: #b00020;
    }

    /* ---------- Header ---------- */
    .statement_text {
      text-align: center;
      font-style: italic;
      margin-bottom: 30px;
    }

    /* ---------- Gallery ---------- */
    .gallery {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      max-width: 90vw;
      margin: auto;
      padding-bottom: 40px;
    }

    .gallery-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 6px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery-img:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2);
    }

    /* ---------- Media Section ---------- */
    .media-section {
      text-align: center;
      background: #faf3e0;
      padding: 40px 20px;
      max-width: 85%;
      margin: 40px auto;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .media-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      justify-items: center;
      margin-top: 20px;
    }

    .media-item p {
      font-weight: 700;
      margin-top: 10px;
    }

    video,
    audio,
    .media-item img {
      width: 100%;
      max-width: 320px;
      border-radius: 8px;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 1024px) {
      .gallery {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .gallery {
        grid-template-columns: repeat(1, 1fr);
      }
    }
  </style>
</head>

<body>

  <!-- ✅ Navigation -->
  <nav class="navbar">
    <ul>
      <li><a class="navbar-link" href="index.html">Main</a></li>
      <li><a class="navbar-link" href="p1.html">Concept Art</a></li>
      <li><a class="navbar-link" href="p2.html">Graphic Design</a></li>
      <li><a class="navbar-link" href="p3.html">Sketchbook</a></li>
      <li><a class="navbar-link" href="p4.html">About</a></li>
    </ul>
  </nav>

  <!-- Header -->
  <div class="container">
    <header class="twelve columns">
      <h3>Sketchbook</h3>
      <div class="statement_text">
        All new souls are given unique and individual personalities.
      </div>
    </header>
  </div>

  <!-- Image Gallery -->
  <div class="gallery">
    <img src="image/V-1.jpg" class="gallery-img" alt="">
    <img src="image/V-2.jpg" class="gallery-img" alt="">
    <img src="image/V-3.jpg" class="gallery-img" alt="">
    <img src="image/V-4.jpg" class="gallery-img" alt="">
    <img src="images/V-5.jpg" class="gallery-img" alt="">
    <img src="images/V-6.jpg" class="gallery-img" alt="">
    <img src="images/V-7.jpg" class="gallery-img" alt="">
    <img src="images/V-8.jpg" class="gallery-img" alt="">
    <img src="image/R-1.jpg" class="gallery-img" alt="">
    <img src="image/R-2.jpg" class="gallery-img" alt="">
  </div>

  <!-- Media -->
  <div class="media-section">
    <h3>Sound Design</h3>

    <div class="media-container">
      <div class="media-item">
        <video controls>
          <source src="video/p-1.mov" type="video/mp4">
        </video>
        <p>Dreamland</p>
      </div>

      <div class="media-item">
        <video controls>
          <source src="video/Video Art Exercise 4 Video + Sound Essay Project.mov" type="video/mp4">
        </video>
        <p>Fairy Tales</p>
      </div>

      <div class="media-item">
        <audio controls>
          <source src="video/p-2.mp3" type="audio/mp3">
        </audio>
        <p>Landslide</p>
      </div>

      <div class="media-item">
        <video controls>
          <source src="video/E-1.mov" type="video/mp4">
        </video>
        <p>Fence</p>
      </div>

      <div class="media-item">
        <video controls>
          <source src="video/森林blender动画.mov" type="video/mp4">
        </video>
        <p>Forests</p>
      </div>

      <div class="media-item">
        <img src="images/屏幕截图 2025-03-26 154558.png" alt="">
        <p>Sound Visual</p>
      </div>
    </div>
  </div>

</body>
</html>
